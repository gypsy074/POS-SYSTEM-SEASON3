<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lottie Diagnostics</title>
<style>
    body { font-family: Consolas, 'Segoe UI', monospace; background: #1e1a15; color: #ece4d9; padding: 24px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.2rem; color: #c2905e; }
    .step { padding: 10px 14px; border-left: 4px solid #555; margin: 8px 0; background: #241f1a; border-radius: 6px; white-space: pre-wrap; }
    .pass { border-color: #2e9e44; }
    .fail { border-color: #e74c3c; }
    .warn { border-color: #f5c76a; }
    .stage-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .stage-box { width: 160px; height: 150px; background: #fff; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-size: 0.7rem; text-align: center; }
    .stage-box > div { width: 120px; height: 100px; }
</style>
</head>
<body>
<h1>POS Lottie diagnostics</h1>
<div id="out"></div>
<div class="stage-row">
    <div class="stage-box"><div id="pv-success"></div>success</div>
    <div class="stage-box"><div id="pv-cart"></div>cart</div>
    <div class="stage-box"><div id="pv-coffee"></div>coffee</div>
    <div class="stage-box"><div id="pv-burst"></div>burst</div>
    <div class="stage-box"><div id="pv-pulse"></div>pulse</div>
</div>

<!-- Load the library the NORMAL way first -->
<script src="../vendor/lottie.min.js"></script>
<!-- Then the real production module -->
<script src="../js/lottie-anim.js"></script>
<script>
(function () {
    const out = document.getElementById("out");
    const add = (text, cls) => {
        const d = document.createElement("div");
        d.className = "step " + (cls || "");
        d.textContent = text;
        out.appendChild(d);
    };

    // 1. Library via plain script tag
    if (window.lottie && typeof window.lottie.loadAnimation === "function") {
        add("PASS 1/5 · vendor/lottie.min.js loaded via script tag", "pass");
    } else {
        add("FAIL 1/5 · vendor/lottie.min.js did NOT execute. Network/static-serving problem.", "fail");
    }

    // 2. Production module present?
    if (!window.PosLottie) {
        add("FAIL 2/5 · js/lottie-anim.js did not run (window.PosLottie missing) — you are serving/caching an old file.", "fail");
        finishNoModule();
        return;
    }
    add("PASS 2/5 · js/lottie-anim.js ran (PosLottie exists)", "pass");

    // 3. Is it the FIXED build? (_debug was added in the fix commit)
    if (PosLottie._debug && PosLottie._debug.pulseData) {
        add("PASS 3/5 · module is the FIXED build (_debug exposed)", "pass");
    } else {
        add("WARN 3/5 · module is an OLD build (no _debug) — browser cache still serving previous version.", "warn");
    }

    // 4. Service worker / cache state
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        add("INFO · service worker IS controlling this page. Scope: " + navigator.serviceWorker.controller.scriptURL);
    } else {
        add("INFO · no service worker controlling this page.");
    }
    if (window.caches && caches.keys) {
        caches.keys().then(keys => add("INFO · caches present: " + (keys.join(", ") || "(none)")));
    }

    // 5. Mount all five animations with the REAL pipeline data
    let mounted = 0;
    const targets = [
        ["success", () => PosLottie._debug.successData()],
        ["cart", () => PosLottie._debug.cartData([0.42, 0.31, 0.231, 1], [0.992, 0.953, 0.922, 1])],
        ["coffee", () => PosLottie._debug.coffeeData()],
        ["burst", () => PosLottie._debug.burstData([0.761, 0.565, 0.369, 1])],
        ["pulse", () => PosLottie._debug.pulseData([0.086, 0.639, 0.29, 1])]
    ];
    try {
        targets.forEach(([name, build]) => {
            const el = document.getElementById("pv-" + name);
            window.lottie.loadAnimation({ container: el, renderer: "svg", loop: true, autoplay: true, animationData: build() });
            mounted++;
        });
        add((mounted === 5 ? "PASS" : "WARN") + ` 5/5 · ${mounted}/5 preview animations mounted above — WATCH THEM: do the shapes MOVE?`, mounted === 5 ? "pass" : "warn");
    } catch (err) {
        add("FAIL 5/5 · mounting threw: " + err.message, "fail");
    }

    function finishNoModule() {
        add("ACTION · Hard-refresh twice (Ctrl+F5), or DevTools → Application → Storage → Clear site data, then reload this page.", "warn");
    }
})();
</script>
</body>
</html>
