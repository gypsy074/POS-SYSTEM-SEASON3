name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -sf --max-time 30 https://season3-pos.onrender.com/api/health \
            || echo "Health check failed (service may be waking) — not failing the job."