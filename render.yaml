# Render blueprint — one-click deployment for the Season 3 POS backend.
# Connect the repo in Render → Blueprint → this file is auto-detected.
# Alternatively create a manual "Web Service" using the settings in the comments below.

services:
  - type: web
    name: season3-pos
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # MONGO_URI must be provided in the Render dashboard (never commit it).
      - key: MONGO_URI
        sync: false
      # Randomly generated strong secret on first provision — overridable.
      - key: JWT_SECRET
        generateValue: true
      # Explicit origins only. Add a concrete LAN origin when a separately
      # hosted device must call the API; never use "*" in production.
      - key: CORS_ORIGIN
        value: 'https://season3-pos.onrender.com,http://localhost:3000,http://127.0.0.1:3000'
      # Add one email provider in the Render dashboard, not in this file:
      # RESEND_API_KEY + EMAIL_FROM (recommended), or SMTP_HOST/PORT/USER/PASS
      # + EMAIL_FROM. Never commit provider secrets here.
    # Manual Web Service equivalent:
    #   Root Directory : backend
    #   Build Command  : npm install
    #   Start Command  : node server.js
    #   Environment    : Node (Free tier works)